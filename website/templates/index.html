{% extends "base.html" %}

{% block content %}

<nav class="controls" role="navigation" aria-label="Primary actions">

        class="button"
        href="https://discord.gg/QMuSphMAw2"

    <a
        class="button"
        href="https://github.com/H3-Apps/HueSurf"
