<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>HueSurf</title>

        <!-- JetBrains Mono from Google Fonts (weights used: 300 light, 800 extra-bold) -->
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,800;1,800&display=swap"
            rel="stylesheet"
        />

        <style>
            :root {
                --bg: #000; /* black background */
                --fg: #fff; /* white text */
                --gap: 28px;
                --btn-pad: 12px 26px;
                --radius: 8px;
            }

            html,
            body {
                height: 100%;
                margin: 0;
                background: var(--bg);
                color: var(--fg);
                font-family:
                    "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo,
                    monospace;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            /* Center everything */
            .wrap {
                min-height: 100vh;
                display: grid;
                place-items: center;
                text-align: center;
                padding: 40px;
                box-sizing: border-box;
            }

            /* Title: Hue (extra bold italic) + Surf (light) */
            .title {
                font-size: clamp(36px, 8vw, 84px);
                line-height: 1;
                margin: 0 0 24px 0;
                letter-spacing: -0.02em;
            }

            .title .hue {
                font-style: italic;
                font-weight: 800; /* extra-bold */
                display: inline-block;
                margin-right: 6px;
            }

            .title .surf {
                font-weight: 300; /* light */
                font-style: normal;
                display: inline-block;
            }

            /* Buttons row */
            .controls {
                display: flex;
                gap: var(--gap);
                justify-content: center;
                align-items: center;
                flex-wrap: wrap;
            }

            a.button {
                text-decoration: none;
                color: var(--fg);
                border: 1px solid currentColor;
                padding: var(--btn-pad);
                border-radius: var(--radius);
                font-size: 16px;
                display: inline-block;
                transition:
                    transform 120ms ease,
                    opacity 120ms ease;
                background: transparent;
                cursor: pointer;
                user-select: none;
            }

            a.button:active {
                transform: translateY(1px) scale(0.997);
            }
            a.button:hover, a.button:focus-visible {
                opacity: 0.9;
                transform: translateY(-2px);
                outline: 2px solid var(--fg);
                outline-offset: 2px;
            }

            /* Subtle caption */
            .meta {
                margin-top: 22px;
                font-size: 13px;
                opacity: 0.7;
            }

            /* Respect prefers-color-scheme if user wants black on white instead */
            @media (prefers-color-scheme: light) {
                :root {
                    --bg: #fff;
                    --fg: #000;
                }
                a.button {
                    background: transparent;
                }
            }
        </style>
    </head>
    <body>
        <main class="wrap" role="main">
            <h1 class="title" aria-label="HueSurf">
                <span class="hue">Hue</span><span class="surf">Surf</span>
            </h1>

            <nav
                class="controls"
                role="navigation"
                aria-label="Primary actions"
            >
                <!-- Download: a small placeholder README file (data URI, base64) -->
                <a
                    class="button"
                    href="data:application/octet-stream;base64,SHVlU3VyZgpNaW5pbWFsaXN0IGJyb3dzZXIgcGxhY2Vob2xkZXIuClZlcnNpb24gMC4xCmh0dHBzOi8vZ2l0aHViLmNvbS9IMy1BcHBzL0h1ZVN1cmYK"
                    download="HueSurf-README.txt"
                    role="button"
                    aria-label="Download HueSurf placeholder"
                >
                    Download
                </a>

                <a
                    class="button"
                    href="https://discord.gg/QMuSphMAw2"
                    target="_blank"
                    rel="noopener noreferrer"
                    role="button"
                    aria-label="Open HueSurf Discord"
                >
                    Discord
                </a>

                <!-- GitHub button -->
                <a
                    class="button"
                    href="https://github.com/H3-Apps/HueSurf"
                    target="_blank"
                    rel="noopener noreferrer"
                    role="button"
                    aria-label="Open HueSurf GitHub repository"
                >
                    GitHub
                </a>
            </nav>

            <p class="meta">
                A lightweight chromium based browser without ads, ai, sponsors,
                or bloat.
            </p>
        </main>
    </body>
</html>
